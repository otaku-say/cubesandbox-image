name: Branch Build (test)

# 特性分支试构建：只构建“相对 main 有 Dockerfile 变更”的目录，
# 构建后跑目录内的 smoke-test.sh；通过才推 :test 标签（不动 :latest）。
# 合入 main 后由 build.yml 走正式流程。

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.scan.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scan
        run: |
          set -euo pipefail
          git fetch -q origin main || true
          base="$(git merge-base origin/main HEAD 2>/dev/null || echo origin/main)"
          changed=$(git diff --name-only "${base}"...HEAD -- '*/Dockerfile' | xargs -r -n1 dirname | sort -u || true)
          if [ -z "${changed}" ]; then
            echo "相对 main 无 Dockerfile 变更，回退为全量目录"
            changed=$(find . -mindepth 3 -maxdepth 3 -name Dockerfile -not -path "./.github/*" | sed 's|^\./||' | xargs -n1 dirname | sort -u)
          fi
          dirs=$(printf '%s\n' "${changed}" | sed '/^$/d' | jq -Rsc 'split("\n")[:-1]')
          echo "dirs=${dirs}" >> "$GITHUB_OUTPUT"
          echo "本次构建目录: ${dirs}"

  build:
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4

      - name: 释放 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: 构建（本地加载，暂不推送）
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: csi-test/${{ matrix.dir }}:test
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dir }}

      - name: 冒烟测试
        run: |
          set -euo pipefail
          if [ -x "${{ matrix.dir }}/smoke-test.sh" ]; then
            bash "${{ matrix.dir }}/smoke-test.sh" "csi-test/${{ matrix.dir }}:test"
          else
            echo "（该目录未提供 smoke-test.sh，跳过）"
          fi

      - name: 推送 :test 标签（冒烟通过后）
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          dst="ghcr.io/${{ github.repository }}/${{ matrix.dir }}:test"
          docker tag "csi-test/${{ matrix.dir }}:test" "${dst}"
          docker push "${dst}"
          echo "已推送 ${dst}"

      - name: 汇总
        run: |
          {
            echo "### ${{ matrix.dir }}"
            echo ""
            echo "- 冒烟测试：通过"
            echo "- 试构建标签：\`ghcr.io/${{ github.repository }}/${{ matrix.dir }}:test\`"
          } >> "$GITHUB_STEP_SUMMARY"
