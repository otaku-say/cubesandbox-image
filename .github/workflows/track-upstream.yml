name: Track Upstream Images

# 跟踪各目录 upstream.txt 声明的上游镜像 digest；
# 变更时：记录 digest → 触发 Build Images 重建 → 开 issue 提醒重新注册模板。
# 首次运行只记录基线，不误报。

on:
  schedule:
    - cron: "0 20 * * *" # 每天 UTC 20:00（北京时间 04:00）
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 采集上游 digest
        id: collect
        run: |
          set -euo pipefail
          mkdir -p upstream
          refs=$(find . -name upstream.txt -not -path "./.github/*" | sort | xargs cat \
            | sed 's/#.*//' | sed '/^[[:space:]]*$/d' | sort -u)
          echo "跟踪清单:"; echo "$refs"
          changed=0; wrote=0
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            name=$(echo "$src" | tr '/:' '__')
            digest=$(docker buildx imagetools inspect "$src" --format '{{json .Manifest.Digest}}' | tr -d '"' || true)
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "!! 跳过 $src：无法获取 digest（仓库不可达/需鉴权），不写入不误报" >&2
              continue
            fi
            old=""; [ -f "upstream/$name.digest" ] && old=$(cat "upstream/$name.digest")
            if [ "$old" != "$digest" ]; then
              echo "$digest" > "upstream/$name.digest"; wrote=1
              if [ -n "$old" ]; then changed=1; echo "$name: $old -> $digest"; else echo "$name: 记录基线 $digest"; fi
            fi
          done <<< "$refs"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "wrote=$wrote" >> "$GITHUB_OUTPUT"

      - name: Harbor 新 tag 巡检（aio-daemon / aio-computer，两个仓库都没有 latest 标签）
        id: harbor
        run: |
          set -euo pipefail
          R=enterprise-public-cn-beijing.cr.volces.com
          found=0
          for repo in vefaas-public/aio-daemon vefaas-public/aio-computer; do
            dir="agent-infra/${repo##*/}"
            [ -f "$dir/Dockerfile" ] || continue
            pinned=$(sed -nE 's/^ARG AIO_[A-Z]+_TAG=([^ ]+).*/\1/p' "$dir/Dockerfile" | head -1)
            tok=$(curl -s "https://$R/service/token?service=harbor-registry&scope=repository:$repo:pull" | jq -r '.token // empty')
            tags=$(curl -s -H "Authorization: Bearer $tok" "https://$R/v2/$repo/tags/list" | jq -r '.tags[]?' | grep -v -- '-nydus' | sort -V | tail -1)
            echo "$dir: pinned=$pinned newest=$tags"
            if [ -n "$tags" ] && [ "$tags" != "$pinned" ]; then
              echo "$repo 有新 tag: $tags（当前固定 $pinned）" | tee -a /tmp/harbor-new.txt
              found=1
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: aiod 新版本巡检（agent-infra/aio-code，比对 latest 与固定版本的 SHA256）
        id: aiod
        run: |
          set -euo pipefail
          B=https://aio-static.tos-cn-beijing.volces.com
          dir=agent-infra/aio-code
          found=0
          if [ -f "$dir/Dockerfile" ]; then
            pinned=$(sed -nE 's/^ARG AIOD_VERSION=([^ ]+).*/\1/p' "$dir/Dockerfile" | head -1)
            # SHA256SUMS 第一行 aiod 的校验值 = 该版本的二进制指纹
            sha_pin=$(curl -fsSL "$B/$pinned/linux-x86_64/SHA256SUMS" | awk '$2=="aiod"{print $1; exit}')
            sha_new=$(curl -fsSL "$B/latest/linux-x86_64/SHA256SUMS" | awk '$2=="aiod"{print $1; exit}')
            echo "pinned=$pinned sha_pin=${sha_pin:0:12}… sha_latest=${sha_new:0:12}…"
            if [ -n "${sha_pin:-}" ] && [ -n "${sha_new:-}" ] && [ "$sha_pin" != "$sha_new" ]; then
              echo "aiod 有新版本（latest 指纹与 $pinned 不同）" | tee /tmp/aiod-new.txt
              found=1
            fi
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: 开 issue 提醒升级 aiod
        if: steps.aiod.outputs.found == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "aiod 发布了新版本 $(date -u +%F)" \
            --body "$(cat <<'EOF'
          latest/linux-x86_64/aiod 的 SHA256 与 agent-infra/aio-code 固定的版本不一致。

          处理方式：把该目录 Dockerfile 的 `ARG AIOD_VERSION` 改成新版本（或核对发布页确认），
          push 到 main → CI 自动重建 :latest，再用 `cubesandbox-sdk-go tpl-from-image ... --create` 更新模板。
          EOF
          )"

      - name: 开 issue 提醒升级 tag（Harbor）
        if: steps.harbor.outputs.found == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "上游 aio-daemon/aio-computer 发布了新 tag $(date -u +%F)" \
            --body "$(cat <<'EOF'
          检测到火山仓库发布了新 tag（这两个仓库没有 latest 标签，无法自动跟 digest）：

          $(cat /tmp/harbor-new.txt 2>/dev/null || true)

          处理方式：把对应目录 Dockerfile 里的 `ARG AIO_DAEMON_TAG` / `ARG AIO_COMPUTER_TAG`
          改成新 tag → push 到 main → CI 自动重建并推送 `:latest`。
          EOF
          )"

      - name: 提交 digest 变更
        if: steps.collect.outputs.wrote == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add upstream
          git diff --cached --quiet || git commit -m "chore: 上游镜像 digest 更新 $(date -u +%F)"
          git push

      - name: 触发重建
        if: steps.collect.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml || echo "(自动触发失败，请手动 dispatch Build Images)"

      - name: 开 issue 通知
        if: steps.collect.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "上游镜像已更新，请重新注册 CubeSandbox 模板 $(date -u +%F)" \
            --body "$(cat <<'EOF'
          检测到上游镜像 digest 变化，已触发镜像重建（:latest）。
          重建完成后，请在 CubeSandbox 控制节点按对应目录的 README 重新注册模板。
          最新 digest 见仓库 `upstream/` 目录的最近一次提交。
          EOF
          )"
