name: Build Images

# 自动发现所有 <org>/<project>/Dockerfile 目录（矩阵构建），
# 逐个构建并推送 ghcr.io/<owner>/<repo>/<org>/<project>:latest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/Dockerfile"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.scan.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          set -euo pipefail
          dirs=$(find . -mindepth 3 -maxdepth 3 -name Dockerfile -not -path "./.github/*" \
            | sed 's|^\./||' | xargs -n1 dirname | sort | jq -Rsc 'split("\n")[:-1]')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "发现镜像目录: $dirs"

  build:
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    steps:
      - uses: actions/checkout@v4

      - name: 释放 runner 磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository }}/${{ matrix.dir }}:latest
